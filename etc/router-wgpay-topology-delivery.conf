# VM101 durable topology generation/outbox and transport-neutral retry contract.
TOPOLOGY_DELIVERY_SCHEMA=router-wgpay-topology-delivery-config-v1
TOPOLOGY_DELIVERY_ENABLED=0
TOPOLOGY_DELIVERY_INTERVAL_SEC=10
TOPOLOGY_DELIVERY_INPUT_SCHEMA=router-wgpay-slot-topology-v1
TOPOLOGY_DELIVERY_ACK_SCHEMA=router-wgpay-slot-topology-ack-v1
TOPOLOGY_DELIVERY_STATE_SCHEMA=router-wgpay-topology-delivery-state-v1
TOPOLOGY_DELIVERY_FALLBACK_STATE=/etc/router-wgpay-fallback/state.kv
TOPOLOGY_DELIVERY_STATE_DIR=/etc/router-wgpay-topology-delivery
TOPOLOGY_DELIVERY_LOCK=/var/run/router-wgpay-topology-delivery.lock
TOPOLOGY_DELIVERY_COMMAND=/usr/local/sbin/router-wgpay-topology-transport.sh
TOPOLOGY_DELIVERY_MAX_ACK_BYTES=8192

# VM101 watcher -> fallback mapper -> topology outbox integration.
WATCHER_TOPOLOGY_SCHEMA=router-wgpay-watcher-topology-state-v1
WATCHER_TOPOLOGY_STATE_DIR=/etc/router-wgpay-watcher-topology
WATCHER_TOPOLOGY_STATE_FILE=/etc/router-wgpay-watcher-topology/state.kv
WATCHER_TOPOLOGY_LOCK_FILE=/var/run/router-wgpay-watcher-topology.lock
WATCHER_TOPOLOGY_FALLBACK_STATE=/etc/router-wgpay-fallback/state.kv
WATCHER_TOPOLOGY_FALLBACK_ACK=/etc/router-wgpay-fallback/ack.kv
WATCHER_TOPOLOGY_MAPPER_APPLY=/usr/local/sbin/router-wgpay-canary-apply.sh
WATCHER_TOPOLOGY_OUTBOX=/usr/local/sbin/router-wgpay-topology-outbox.sh
WATCHER_TOPOLOGY_NFT_TABLE=router_egress_dscp_canary
WATCHER_TOPOLOGY_CANONICAL_SLOTS=egress1,egress2,egress3,egress4,egress5
WATCHER_TOPOLOGY_CANONICAL_SELECTORS=cs1,cs2,cs3,cs4,cs5
WATCHER_TOPOLOGY_FALLBACK_LOCK_FILE=/var/run/router-wgpay-fallback.lock
WATCHER_TOPOLOGY_OUTBOX_LOCK_FILE=/var/run/router-wgpay-topology-delivery.lock

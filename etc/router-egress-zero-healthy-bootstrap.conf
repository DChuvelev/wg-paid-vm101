# schema=router-egress-zero-healthy-bootstrap-config-v1
# R20Q-N controller extended in R20Q-P with asynchronous provider-direct request handoff.
BOOTSTRAP_CONTROLLER_ENABLED=1
BOOTSTRAP_CONTROLLER_TICK_SEC=30
BOOTSTRAP_CONTROLLER_STATE_DIR=/etc/router-egress-zero-healthy-bootstrap
BOOTSTRAP_CONTROLLER_STATE_FILE=/etc/router-egress-zero-healthy-bootstrap/state.kv
BOOTSTRAP_CONTROLLER_LOCK_DIR=/var/run/router-egress-zero-healthy-bootstrap.lock
BOOTSTRAP_CONTROLLER_DIRECT_STATE=/etc/router-wgpay-direct/state.kv
BOOTSTRAP_CONTROLLER_STATUS_CMD=/usr/local/sbin/router-egress-slots-status.sh
BOOTSTRAP_CONTROLLER_DISPATCHER=/usr/local/sbin/router-egress-recovery-dispatcher.sh
BOOTSTRAP_CONTROLLER_RECOVERY_STATE_HELPER=/usr/local/lib/router-egress-recovery-state.sh
BOOTSTRAP_CONTROLLER_LOG=/var/log/router-egress-zero-healthy-bootstrap.log
BOOTSTRAP_CONTROLLER_REASON=zero_healthy_cached_bootstrap
# R20Q-P provider acquisition request handoff. The controller only requests;
# the provider worker owns download execution and backoff.
BOOTSTRAP_CONTROLLER_PROVIDER_DIRECT_ENABLED=1
BOOTSTRAP_CONTROLLER_PROVIDER_DIRECT_HELPER=/usr/local/sbin/router-egress-provider-direct.sh
BOOTSTRAP_CONTROLLER_PROVIDER_POLL_SEC=30

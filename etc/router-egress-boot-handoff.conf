# schema=router-egress-boot-handoff-config-v1
# R20Q-U-B1: single production boot owner for VM101 runtime generation, VPN links and recovery controllers.
BOOT_HANDOFF_ENABLED=1
BOOT_HANDOFF_LOCK_DIR=/var/run/router-egress-boot-handoff.lock
BOOT_HANDOFF_READY_FILE=/var/run/router-egress-boot-handoff.ready
BOOT_HANDOFF_LOG=/var/log/router-egress-boot-handoff.log
BOOT_HANDOFF_WAIT_TIMEOUT_SEC=120
BOOT_HANDOFF_WAIT_POLL_SEC=2
BOOT_HANDOFF_NETWORK_CONFIG=/etc/config/network
BOOT_HANDOFF_RECOVERY_STATE_HELPER=/usr/local/lib/router-egress-recovery-state.sh
BOOT_HANDOFF_GENERATION_CONFIG=/etc/router-egress-generation.conf
BOOT_HANDOFF_GENERATION_VALIDATOR=/usr/local/sbin/router-egress-generation-validate
BOOT_HANDOFF_SLOTS_APPLY=/usr/local/sbin/router-egress-slots-apply.sh
BOOT_HANDOFF_SLOTS_STATUS=/usr/local/sbin/router-egress-slots-status.sh
BOOT_HANDOFF_TOPOLOGY_OUTBOX=/usr/local/sbin/router-wgpay-topology-outbox.sh
BOOT_HANDOFF_PROVIDER_DIRECT_CONFIG=/etc/router-egress-provider-direct.conf
BOOT_HANDOFF_BOOTSTRAP_CONFIG=/etc/router-egress-zero-healthy-bootstrap.conf
BOOT_HANDOFF_INITD_DIR=/etc/init.d
BOOT_HANDOFF_SERVICE_ORDER="router-wgpay-topology-delivery router-egress-zero-healthy-bootstrap router-egress-health-repair router-egress-full-pool-refresh-retry"
BOOT_HANDOFF_PROVIDER_DIRECT_SERVICE=router-egress-provider-direct
BOOT_HANDOFF_VPN_INTERFACES="vpn1 vpn2 vpn3 vpn4 vpn5"
